<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PROMPTER — Apple & Studio Teleprompter</title>
  
  <!-- Apple Web App & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Marked.js for Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <!-- PDF.js for Browser-native PDF text extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // Configure PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>

  <!-- Mammoth.js for .docx extraction -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

  <style>
    /* Apple SF Pro Typography & Theme Tokens */
    :root {
      --font-stack: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --bg-midnight: #000000;
      --surface-midnight: rgba(22, 22, 24, 0.75);
      --surface-elevated: rgba(36, 36, 40, 0.85);
      --border-midnight: rgba(255, 255, 255, 0.12);
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --accent: #2997ff;
      --accent-rgb: 41, 151, 255;
      --focus-guide: rgba(41, 151, 255, 0.85);
      --danger: #ff453a;
      --ease-apple: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Studio Themes */
    body.theme-midnight {
      --bg-main: #000000;
      --text-prompter: #ffffff;
      --text-dim: #555555;
      --card-bg: rgba(24, 24, 28, 0.65);
      --focus-guide: rgba(41, 151, 255, 0.85);
    }

    body.theme-paper {
      --bg-main: #fbfbfd;
      --text-prompter: #1d1d1f;
      --text-dim: #c7c7cc;
      --card-bg: rgba(240, 240, 244, 0.8);
      --focus-guide: rgba(0, 113, 227, 0.75);
    }

    body.theme-sepia {
      --bg-main: #181412;
      --text-prompter: #f5ebd9;
      --text-dim: #4d443c;
      --card-bg: rgba(34, 28, 25, 0.75);
      --focus-guide: rgba(230, 160, 60, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: var(--font-stack);
      background-color: var(--bg-main, #000000);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      transition: background-color 0.4s var(--ease-apple);
    }

    input, textarea, [contenteditable="true"] {
      user-select: text;
    }

    /* Frosted Glass Utilities */
    .glass {
      background: var(--surface-midnight);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid var(--border-midnight);
    }

    .glass-pill {
      background: rgba(30, 30, 34, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    /* Screen Views */
    .view {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease-apple), transform 0.3s var(--ease-apple);
    }

    .view.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    /* ========================================================= */
    /* 1. STUDIO EDITOR & SCRIPT LIBRARY VIEW                   */
    /* ========================================================= */
    #editorView {
      background: #000000;
      color: #f5f5f7;
    }

    /* Header Nav */
    .nav-header {
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #2997ff, #147ce5);
      color: #fff;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 500;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255, 255, 255, 0.06);
      color: #f5f5f7;
      cursor: pointer;
      transition: all 0.2s var(--ease-apple);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255,255,255,0.24);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #2997ff;
      border-color: #2997ff;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(41, 151, 255, 0.35);
    }

    .btn-primary:hover {
      background: #0077ed;
      border-color: #0077ed;
    }

    .btn-icon-only {
      width: 38px;
      height: 38px;
      padding: 0;
      border-radius: 50%;
    }

    /* Dual-Pane Editor Workspace */
    .workspace {
      display: flex;
      flex: 1;
      height: calc(100% - 60px);
      overflow: hidden;
    }

    /* Library Sidebar */
    .sidebar {
      width: 320px;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      background: #09090b;
      transition: transform 0.3s var(--ease-apple);
    }

    .sidebar-header {
      padding: 16px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .script-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .script-item {
      padding: 12px 14px;
      border-radius: 12px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s;
    }

    .script-item:hover {
      background: rgba(255, 255, 255, 0.04);
    }

    .script-item.active {
      background: rgba(41, 151, 255, 0.12);
      border-color: rgba(41, 151, 255, 0.3);
    }

    .script-item-title {
      font-size: 0.9rem;
      font-weight: 500;
      color: #f5f5f7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .script-item-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .script-item.active .script-item-title {
      color: #64b5ff;
    }

    /* Main Script Editor Stage */
    .editor-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000000;
      position: relative;
    }

    .editor-topbar {
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      gap: 16px;
    }

    .title-input {
      background: transparent;
      border: none;
      font-size: 1.35rem;
      font-weight: 600;
      color: #ffffff;
      outline: none;
      width: 100%;
      letter-spacing: -0.015em;
    }

    .title-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .editor-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    /* Drag and Drop Dropzone / Text Editor */
    .editor-container {
      flex: 1;
      padding: 24px 28px;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .script-textarea {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #e5e5ea;
      font-size: 1.15rem;
      line-height: 1.7;
      font-family: var(--font-stack);
      resize: none;
      white-space: pre-wrap;
    }

    .script-textarea::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Drag and Drop Floating Overlay */
    .drop-overlay {
      position: absolute;
      inset: 16px;
      border: 2px dashed #2997ff;
      border-radius: 16px;
      background: rgba(41, 151, 255, 0.06);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 50;
    }

    .drop-overlay.drag-over {
      opacity: 1;
      pointer-events: auto;
    }

    .drop-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #2997ff;
    }

    /* Hidden File Input */
    #fileInput {
      display: none;
    }

    /* ========================================================= */
    /* 2. LIVE TELEPROMPTER VIEW                                 */
    /* ========================================================= */
    #prompterView {
      background-color: var(--bg-main);
      cursor: none;
      touch-action: pan-y;
    }

    #prompterView.cursor-show {
      cursor: default;
    }

    /* Viewport transforms for Beamsplitter glass mirrors */
    .prompter-viewport {
      width: 100%;
      height: 100%;
      overflow-y: scroll;
      overflow-x: hidden;
      scroll-behavior: auto;
      scrollbar-width: none; /* Firefox */
      -ms-overflow-style: none; /* IE 10+ */
      position: relative;
    }

    .prompter-viewport::-webkit-scrollbar {
      display: none; /* Safari and Chrome */
    }

    .prompter-mirror-x {
      transform: scaleX(-1);
    }

    .prompter-mirror-y {
      transform: scaleY(-1);
    }

    .prompter-mirror-xy {
      transform: scale(-1, -1);
    }

    /* Content Column */
    .prompter-content-wrapper {
      margin: 0 auto;
      width: 100%;
      max-width: 820px;
      padding: 45vh 32px 55vh; /* Center active line at ~45% screen */
      transition: max-width 0.25s var(--ease-apple);
    }

    .prompter-text {
      color: var(--text-prompter);
      font-size: 48px;
      line-height: 1.5;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: pre-wrap;
      word-break: break-word;
      transition: font-size 0.2s, line-height 0.2s;
    }

    /* Center Eye-line Reading Guide */
    .eyeline-guide {
      position: absolute;
      top: 45%;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--focus-guide);
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 0 16px var(--focus-guide);
      display: flex;
      align-items: center;
      justify-content: space-between;
      opacity: 0.75;
      transition: opacity 0.3s;
    }

    .eyeline-guide.hide {
      opacity: 0;
    }

    .eyeline-bracket-left,
    .eyeline-bracket-right {
      width: 16px;
      height: 28px;
      border: 3px solid var(--focus-guide);
      margin: 0 12px;
    }
    .eyeline-bracket-left { border-right: none; border-radius: 6px 0 0 6px; }
    .eyeline-bracket-right { border-left: none; border-radius: 0 6px 6px 0; }

    /* Top Progress Scrubber Bar */
    .prompter-progress-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 55;
      cursor: pointer;
    }

    .prompter-progress-fill {
      height: 100%;
      width: 0%;
      background: #2997ff;
      box-shadow: 0 0 8px rgba(41, 151, 255, 0.7);
      transition: width 0.1s linear;
    }

    /* Countdown Overlay */
    .countdown-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(12px);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease-apple);
    }

    .countdown-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .countdown-number {
      font-size: 8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 8px 32px rgba(41, 151, 255, 0.5);
      animation: pulsePop 1s infinite;
    }

    @keyframes pulsePop {
      0% { transform: scale(0.7); opacity: 0; }
      40% { transform: scale(1.1); opacity: 1; }
      70% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0; }
    }

    /* Floating Studio Glass HUD */
    .studio-hud {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 1;
      transition: opacity 0.35s var(--ease-apple), transform 0.35s var(--ease-apple);
    }

    .studio-hud.hud-hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      pointer-events: none;
    }

    .hud-island {
      display: flex;
      align-items: center;
      padding: 6px 10px;
      gap: 6px;
      border-radius: 999px;
    }

    .hud-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.08);
      color: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .hud-btn.active {
      background: #2997ff;
      color: #ffffff;
    }

    .hud-btn-play {
      width: 52px;
      height: 52px;
      background: #ffffff;
      color: #000000;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.3);
    }

    .hud-btn-play:hover {
      background: #e5e5ea;
    }

    .hud-speed-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #ffffff;
    }

    .hud-slider {
      -webkit-appearance: none;
      width: 90px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.2);
      outline: none;
      cursor: pointer;
    }

    .hud-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* Secondary HUD Drawer for Typography & Studio Settings */
    .hud-settings-drawer {
      padding: 12px 18px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
    }

    .hud-settings-drawer.hidden {
      display: none;
    }

    .hud-setting-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .theme-chip {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .theme-chip.active {
      border-color: #2997ff;
      transform: scale(1.15);
    }

    /* Screen Wake Lock Pill (Clarified & Interactive) */
    .prompter-status-tag {
      position: absolute;
      top: 14px;
      right: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(18, 18, 20, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 60;
      color: #34c759;
      cursor: pointer;
      transition: all 0.25s var(--ease-apple);
      user-select: none;
    }

    .prompter-status-tag:hover {
      background: rgba(30, 30, 34, 0.9);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .prompter-status-tag.inactive {
      color: #8e8e93;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px #34c759;
      transition: background 0.2s, box-shadow 0.2s;
    }

    .prompter-status-tag.inactive .status-dot {
      background: #8e8e93;
      box-shadow: none;
    }

    /* Formatted Markdown Script Display */
    .prompter-text h1, .prompter-text h2, .prompter-text h3 {
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-top: 1.2em;
      margin-bottom: 0.4em;
      color: #2997ff;
    }
    .prompter-text h1 { font-size: 1.35em; }
    .prompter-text h2 { font-size: 1.2em; }
    .prompter-text h3 { font-size: 1.08em; }
    .prompter-text hr {
      border: none;
      border-top: 2px dashed rgba(255,255,255,0.2);
      margin: 1.5em 0;
    }
    .prompter-text ul, .prompter-text ol {
      padding-left: 1.2em;
      margin: 0.8em 0;
    }
    .prompter-text li {
      margin-bottom: 0.4em;
    }

    /* Modal / Alert Notification Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
    }

    .toast {
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(28, 28, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s var(--ease-apple);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive Breakpoints */
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 60px;
        bottom: 0;
        z-index: 30;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 20px 0 50px rgba(0,0,0,0.8);
      }
      .prompter-content-wrapper {
        padding: 40vh 20px 50vh;
      }
      .prompter-text {
        font-size: 32px;
      }
      .hud-slider {
        width: 60px;
      }
      .hud-settings-drawer {
        flex-wrap: wrap;
        justify-content: center;
        max-width: 90vw;
      }
    }
  </style>
</head>
<body class="theme-midnight">

  <!-- ========================================== -->
  <!-- TOAST NOTIFICATIONS                        -->
  <!-- ========================================== -->
  <div class="toast-container">
    <div id="toast" class="toast">Script loaded</div>
  </div>

  <!-- ========================================== -->
  <!-- VIEW 1: SCRIPT LIBRARY & EDITOR            -->
  <!-- ========================================== -->
  <div id="editorView" class="view active">
    <!-- Navigation Bar -->
    <header class="nav-header">
      <div class="brand-logo">
        <i data-lucide="tv" style="width: 20px; height: 20px; color: #2997ff;"></i>
        <span>PROMPTER</span>
        <span class="brand-badge">STUDIO</span>
      </div>

      <div class="nav-actions">
        <!-- Sidebar Toggle for Mobile -->
        <button id="btnToggleSidebar" class="btn btn-icon-only" title="Toggle Scripts Drawer">
          <i data-lucide="folder" style="width: 18px; height: 18px;"></i>
        </button>

        <!-- Import Button (PDF, DOCX, MD, TXT) -->
        <button id="btnTriggerImport" class="btn" title="Import Document">
          <i data-lucide="file-up" style="width: 16px; height: 16px;"></i>
          <span>Import</span>
        </button>
        <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx">

        <!-- Launch Prompter Button -->
        <button id="btnStartPrompter" class="btn btn-primary" title="Start Teleprompter (Space)">
          <i data-lucide="play" style="width: 16px; height: 16px;"></i>
          <span>Prompt</span>
        </button>
      </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
      <!-- Script Drawer / Library -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-title">Your Scripts</span>
          <button id="btnNewScript" class="btn btn-icon-only" style="width: 28px; height: 28px;" title="New Script">
            <i data-lucide="plus" style="width: 14px; height: 14px;"></i>
          </button>
        </div>
        <div id="scriptList" class="script-list">
          <!-- Rendered via JS -->
        </div>

  <!-- ========================================== -->
  <!-- APPLICATION LOGIC                          -->
  <!-- ========================================== -->
  <script>
    // -------------------------------------------------------------
    // Global State & Storage Models
    // -------------------------------------------------------------
    const STORAGE_KEY = 'prompter_studio_scripts_v1';
    const SETTINGS_KEY = 'prompter_studio_settings_v1';

    const defaultScripts = [
      {
        id: 'welcome-script',
        title: 'Welcome to PROMPTER Studio',
        content: `# Welcome to PROMPTER Studio\n\nThis is an Apple-inspired, studio-grade teleprompter engineered for effortless presentations, YouTube recordings, and keynotes.\n\n## Clean Markdown Parsing\nWhen you paste or import Markdown files, PROMPTER automatically hides messy characters like hashes (#), asterisks (*), and hyphens (---), giving you clean speech typography.\n\n### Essential Features:\n- Screen Keep Awake: Keeps mobile and laptop screens bright and active throughout your take.\n- Beamsplitter Mirroring: One-tap horizontal (M) or vertical flipping for pro glass rigs.\n- Butter-Smooth Scrolling: Precision hardware frame scrolling at your exact speaking pace.\n\nPress Space to pause or play whenever you are ready!`,
        updatedAt: Date.now()
      }
    ];

    let state = {
      scripts: [],
      currentScriptId: null,
      isPlaying: false,
      speed: 28, // 1 - 100
      fontSize: 48,
      readingWidth: 820,
      showEyelineGuide: true,
      mirrorX: false,
      mirrorY: false,
      reverseScroll: false,
      theme: 'midnight',
      wakeLock: null,
      wakeLockWanted: true,
      scrollAccumulator: 0,
      isCountdownActive: false
    };

    // DOM Elements Cache
    const editorView = document.getElementById('editorView');
    const prompterView = document.getElementById('prompterView');
    const scriptList = document.getElementById('scriptList');
    const scriptTitleInput = document.getElementById('scriptTitleInput');
    const scriptContentInput = document.getElementById('scriptContentInput');
    const wordCountLabel = document.getElementById('wordCountLabel');
    const readingTimeLabel = document.getElementById('readingTimeLabel');
    const fileInput = document.getElementById('fileInput');
    const dropOverlay = document.getElementById('dropOverlay');
    const editorDropZone = document.getElementById('editorDropZone');
    const sidebar = document.getElementById('sidebar');

    const prompterViewport = document.getElementById('prompterViewport');
    const prompterWrapper = document.getElementById('prompterWrapper');
    const prompterText = document.getElementById('prompterText');
    const studioHud = document.getElementById('studioHud');
    const settingsDrawer = document.getElementById('settingsDrawer');
    const eyelineGuide = document.getElementById('eyelineGuide');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const speedSlider = document.getElementById('speedSlider');
    const speedValueLabel = document.getElementById('speedValueLabel');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const widthSlider = document.getElementById('widthSlider');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const statusBadge = document.getElementById('statusBadge');
    const wakeLockStatusText = document.getElementById('wakeLockStatusText');
    const toast = document.getElementById('toast');

    // -------------------------------------------------------------
    // Clean Markdown & Formatting Engine
    // -------------------------------------------------------------
    function cleanMarkdownToHTML(rawText) {
      if (!rawText) return '';

      // Check if text has markdown signals: #, *, -, ---, _, >
      const hasMarkdown = /(^#{1,6}\s+|^\s*[-*+]\s+|---|\*\*|__)/m.test(rawText);

      if (hasMarkdown && typeof marked !== 'undefined') {
        try {
          // Parse with marked and strip raw markup symbols
          const html = marked.parse(rawText, { breaks: true, gfm: true });
          return html;
        } catch (e) {
          console.warn('Markdown parsing fallback', e);
        }
      }

      // If plain text, wrap paragraphs cleanly
      return rawText
        .split('\n\n')
        .map(p => `<p style="margin-bottom: 1.2em;">${escapeHtml(p).replace(/\n/g, '<br>')}</p>`)
        .join('');
    }

    function sanitizeMarkdownPastedText(text) {
      // Optional cleaner helper to format raw pasted text
      return text.replace(/\r\n/g, '\n');
    }

    // -------------------------------------------------------------
    // Initialization & LocalStorage Persistence
    // -------------------------------------------------------------
    function initApp() {
      lucide.createIcons();
      loadSettings();
      loadScripts();
      setupEventListeners();
      setupTouchGestures();
      updateStats();
    }

    function loadScripts() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        state.scripts = stored ? JSON.parse(stored) : defaultScripts;
      } catch (e) {
        state.scripts = defaultScripts;
      }

      if (state.scripts.length === 0) {
        state.scripts = defaultScripts;
      }
      state.currentScriptId = state.scripts[0].id;
      renderScriptList();
      loadCurrentScriptIntoEditor();
    }

    function saveScripts() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.scripts));
      } catch (e) {
        console.warn('LocalStorage limit exceeded', e);
      }
    }

    function loadSettings() {
      try {
        const saved = localStorage.getItem(SETTINGS_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.speed = parsed.speed || 28;
          state.fontSize = parsed.fontSize || 48;
          state.readingWidth = parsed.readingWidth || 820;
          state.theme = parsed.theme || 'midnight';
          state.showEyelineGuide = parsed.showEyelineGuide !== undefined ? parsed.showEyelineGuide : true;
        }
      } catch (e) {}

      applyTheme(state.theme);
      speedSlider.value = state.speed;
      speedValueLabel.textContent = state.speed;
      fontSizeSlider.value = state.fontSize;
      widthSlider.value = state.readingWidth;
      prompterText.style.fontSize = `${state.fontSize}px`;
      prompterWrapper.style.maxWidth = `${state.readingWidth}px`;
      if (!state.showEyelineGuide) eyelineGuide.classList.add('hide');
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify({
          speed: state.speed,
          fontSize: state.fontSize,
          readingWidth: state.readingWidth,
          theme: state.theme,
          showEyelineGuide: state.showEyelineGuide
        }));
      } catch (e) {}
    }

    // -------------------------------------------------------------
    // Script Management & Ingestion
    // -------------------------------------------------------------
    function renderScriptList() {
      scriptList.innerHTML = '';
      state.scripts.forEach(script => {
        const item = document.createElement('div');
        item.className = `script-item ${script.id === state.currentScriptId ? 'active' : ''}`;
        
        const words = script.content.trim() ? script.content.trim().split(/\s+/).length : 0;
        const mins = Math.ceil(words / 140);

        item.innerHTML = `
          <div class="script-item-title">${escapeHtml(script.title || 'Untitled')}</div>
          <div class="script-item-meta">
            <span>${words} words</span>
            <span>•</span>
            <span>${mins} min read</span>
          </div>
        `;

        item.addEventListener('click', () => {
          saveCurrentScriptFromEditor();
          state.currentScriptId = script.id;
          renderScriptList();
          loadCurrentScriptIntoEditor();
          if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');
          }
        });

        scriptList.appendChild(item);
      });
    }

    function getCurrentScript() {
      return state.scripts.find(s => s.id === state.currentScriptId) || state.scripts[0];
    }

    function loadCurrentScriptIntoEditor() {
      const current = getCurrentScript();
      if (!current) return;
      scriptTitleInput.value = current.title;
      scriptContentInput.value = current.content;
      updateStats();
    }

    function saveCurrentScriptFromEditor() {
      const current = getCurrentScript();
      if (!current) return;
      current.title = scriptTitleInput.value.trim() || 'Untitled Script';
      current.content = scriptContentInput.value;
      current.updatedAt = Date.now();
      saveScripts();
    }

    function createNewScript(title = 'Untitled Script', content = '') {
      saveCurrentScriptFromEditor();
      const newScript = {
        id: 'script_' + Date.now(),
        title,
        content,
        updatedAt: Date.now()
      };
      state.scripts.unshift(newScript);
      state.currentScriptId = newScript.id;
      saveScripts();
      renderScriptList();
      loadCurrentScriptIntoEditor();
      showToast('Created new script');
    }

    function deleteCurrentScript() {
      if (state.scripts.length <= 1) {
        showToast('Must keep at least one script');
        return;
      }
      state.scripts = state.scripts.filter(s => s.id !== state.currentScriptId);
      state.currentScriptId = state.scripts[0].id;
      saveScripts();
      renderScriptList();
      loadCurrentScriptIntoEditor();
      showToast('Script deleted');
    }

    function updateStats() {
      const text = scriptContentInput.value.trim();
      const words = text ? text.split(/\s+/).length : 0;
      wordCountLabel.textContent = `${words} words`;
      
      const totalSeconds = Math.round((words / 140) * 60);
      const m = Math.floor(totalSeconds / 60);
      const s = totalSeconds % 60;
      readingTimeLabel.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // -------------------------------------------------------------
    // Client-side File Parsers (.txt, .md, .pdf, .docx)
    // -------------------------------------------------------------
    async function handleFileImport(file) {
      if (!file) return;
      showToast(`Parsing ${file.name}...`);
      const filename = file.name;
      const extension = filename.split('.').pop().toLowerCase();
      const title = filename.replace(/\.[^/.]+$/, "");

      try {
        if (extension === 'txt' || extension === 'text') {
          const text = await file.text();
          createNewScript(title, text);
        } else if (extension === 'md' || extension === 'markdown') {
          const mdText = await file.text();
          // Convert markdown to plain reading text via marked tokens
          const cleanText = extractTextFromMarkdown(mdText);
          createNewScript(title, cleanText);
        } else if (extension === 'pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdfText = await extractTextFromPDF(arrayBuffer);
          createNewScript(title, pdfText);
        } else if (extension === 'docx') {
          const arrayBuffer = await file.arrayBuffer();
          const docxResult = await mammoth.extractRawText({ arrayBuffer });
          createNewScript(title, docxResult.value);
        } else {
          showToast('Unsupported format. Use .txt, .md, .pdf, or .docx');
        }
      } catch (err) {
        console.error(err);
        showToast('Error parsing file: ' + err.message);
      }
    }

    function extractTextFromMarkdown(md) {
      // Use marked to tokenize and strip structural syntax into readable script lines
      const tokens = marked.lexer(md);
      let output = '';
      function walk(tokenList) {
        for (const token of tokenList) {
          if (token.type === 'heading') {
            output += `\n\n${token.text.toUpperCase()}\n\n`;
          } else if (token.type === 'paragraph') {
            output += `${token.text}\n\n`;
          } else if (token.type === 'list') {
            token.items.forEach(item => { output += `• ${item.text}\n`; });
            output += '\n';
          } else if (token.tokens) {
            walk(token.tokens);
          }
        }
      }
      walk(tokens);
      return output.trim() || md;
    }

    async function extractTextFromPDF(arrayBuffer) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const pageText = textContent.items.map(item => item.str).join(' ');
        fullText += pageText + '\n\n';
      }
      return fullText.trim();
    }

    // -------------------------------------------------------------
    // Teleprompter Engine & Smooth Scroll Loop
    // -------------------------------------------------------------
    let animationFrameId = null;
    let lastTimestamp = 0;
    let hudHideTimeout = null;

    function startPrompter() {
      saveCurrentScriptFromEditor();
      const current = getCurrentScript();
      if (!current || !current.content.trim()) {
        showToast('Please add script text first');
        return;
      }

      // Render clean typography without raw markdown hashes (#), stars (*), or lines (---)
      prompterText.innerHTML = cleanMarkdownToHTML(current.content);
      prompterViewport.scrollTop = 0;

      editorView.classList.remove('active');
      prompterView.classList.add('active');

      if (state.wakeLockWanted) {
        requestWakeLock();
      }
      resetHudTimeout();
      updateProgress();
      updatePlayButtonUI(false);

      // Trigger 3-second animated countdown
      runCountdown(() => {
        playPrompter();
      });
    }

    function exitPrompter() {
      pausePrompter();
      releaseWakeLock();
      prompterView.classList.remove('active');
      editorView.classList.add('active');
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function updatePlayButtonUI(isPlaying) {
      if (isPlaying) {
        btnPlayPause.innerHTML = `<i data-lucide="pause" style="width: 22px; height: 22px;"></i>`;
        btnPlayPause.style.background = '#2997ff';
        btnPlayPause.style.color = '#ffffff';
        btnPlayPause.style.boxShadow = '0 0 20px rgba(41, 151, 255, 0.6)';
        btnPlayPause.title = 'Pause (Space)';
      } else {
        btnPlayPause.innerHTML = `<i data-lucide="play" style="width: 22px; height: 22px; margin-left: 2px;"></i>`;
        btnPlayPause.style.background = '#ffffff';
        btnPlayPause.style.color = '#000000';
        btnPlayPause.style.boxShadow = '0 4px 18px rgba(255, 255, 255, 0.3)';
        btnPlayPause.title = 'Play (Space)';
      }
      lucide.createIcons();
    }

    function runCountdown(callback) {
      state.isCountdownActive = true;
      let count = 3;
      countdownOverlay.classList.add('show');
      countdownNumber.textContent = count;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNumber.textContent = count;
        } else {
          clearInterval(timer);
          countdownOverlay.classList.remove('show');
          state.isCountdownActive = false;
          if (callback) callback();
        }
      }, 900);
    }

    function playPrompter() {
      if (state.isPlaying) return;
      state.isPlaying = true;
      updatePlayButtonUI(true);
      lastTimestamp = performance.now();
      animationFrameId = requestAnimationFrame(scrollStep);
      resetHudTimeout();
    }

    function pausePrompter() {
      state.isPlaying = false;
      updatePlayButtonUI(false);
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      showHUD();
    }

    function togglePlayPause() {
      if (state.isCountdownActive) return;
      if (state.isPlaying) {
        pausePrompter();
      } else {
        playPrompter();
      }
    }

    function scrollStep(currentTimestamp) {
      if (!state.isPlaying) return;

      const delta = (currentTimestamp - lastTimestamp) / 1000;
      lastTimestamp = currentTimestamp;

      // Speed mapping: 1 -> ~15 px/s, 100 -> ~360 px/s
      const pxPerSecond = (state.speed * 3.4) + 12;
      const movement = pxPerSecond * delta;

      if (state.reverseScroll) {
        prompterViewport.scrollTop -= movement;
      } else {
        prompterViewport.scrollTop += movement;
      }

      updateProgress();

      // Check reached bottom
      const maxScroll = prompterViewport.scrollHeight - prompterViewport.clientHeight;
      if (!state.reverseScroll && prompterViewport.scrollTop >= maxScroll - 2) {
        pausePrompter();
        showToast('Finished script');
        return;
      }

      animationFrameId = requestAnimationFrame(scrollStep);
    }

    function updateProgress() {
      const maxScroll = prompterViewport.scrollHeight - prompterViewport.clientHeight;
      if (maxScroll <= 0) {
        progressFill.style.width = '0%';
        return;
      }
      const pct = Math.min(100, Math.max(0, (prompterViewport.scrollTop / maxScroll) * 100));
      progressFill.style.width = `${pct}%`;
    }

    function scrubToPosition(e) {
      const rect = progressTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      const maxScroll = prompterViewport.scrollHeight - prompterViewport.clientHeight;
      prompterViewport.scrollTop = maxScroll * pct;
      updateProgress();
    }

    // -------------------------------------------------------------
    // Screen Wake Lock API (Keeps mobile & laptop awake)
    // -------------------------------------------------------------
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          state.wakeLock = await navigator.wakeLock.request('screen');
          state.wakeLockWanted = true;
          statusBadge.classList.remove('inactive');
          wakeLockStatusText.textContent = 'KEEP AWAKE: ON';
          state.wakeLock.addEventListener('release', () => {
            if (!state.wakeLockWanted) {
              statusBadge.classList.add('inactive');
              wakeLockStatusText.textContent = 'KEEP AWAKE: OFF';
            }
          });
        } catch (err) {
          console.warn('Wake Lock error:', err);
          statusBadge.classList.add('inactive');
          wakeLockStatusText.textContent = 'AWAKE UNSUPPORTED';
        }
      } else {
        statusBadge.classList.add('inactive');
        wakeLockStatusText.textContent = 'AWAKE UNSUPPORTED';
      }
    }

    function releaseWakeLock() {
      if (state.wakeLock) {
        state.wakeLock.release().catch(() => {});
        state.wakeLock = null;
      }
      statusBadge.classList.add('inactive');
      wakeLockStatusText.textContent = 'KEEP AWAKE: OFF';
    }

    function toggleWakeLock() {
      if (state.wakeLock) {
        state.wakeLockWanted = false;
        releaseWakeLock();
        showToast('Screen Sleep Allowed');
      } else {
        state.wakeLockWanted = true;
        requestWakeLock();
        showToast('Screen Keep Awake Enabled');
      }
    }

    // Re-acquire lock if tab regains focus
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && prompterView.classList.contains('active') && state.wakeLockWanted) {
        requestWakeLock();
      }
    });

    // -------------------------------------------------------------
    // HUD & Inactivity Auto-Hide Engine
    // -------------------------------------------------------------
    function showHUD() {
      studioHud.classList.remove('hud-hidden');
      prompterView.classList.add('cursor-show');
    }

    function hideHUD() {
      if (state.isPlaying) {
        studioHud.classList.add('hud-hidden');
        settingsDrawer.classList.add('hidden');
        prompterView.classList.remove('cursor-show');
      }
    }

    function resetHudTimeout() {
      showHUD();
      if (hudHideTimeout) clearTimeout(hudHideTimeout);
      if (state.isPlaying) {
        hudHideTimeout = setTimeout(hideHUD, 2600);
      }
    }

    // -------------------------------------------------------------
    // Mirror & Theme Modifiers
    // -------------------------------------------------------------
    function updateMirrorTransform() {
      prompterViewport.classList.remove('prompter-mirror-x', 'prompter-mirror-y', 'prompter-mirror-xy');
      if (state.mirrorX && state.mirrorY) {
        prompterViewport.classList.add('prompter-mirror-xy');
      } else if (state.mirrorX) {
        prompterViewport.classList.add('prompter-mirror-x');
      } else if (state.mirrorY) {
        prompterViewport.classList.add('prompter-mirror-y');
      }

      document.getElementById('btnMirrorX').classList.toggle('active', state.mirrorX);
      document.getElementById('btnMirrorY').classList.toggle('active', state.mirrorY);
    }

    function applyTheme(themeName) {
      state.theme = themeName;
      document.body.classList.remove('theme-midnight', 'theme-paper', 'theme-sepia');
      document.body.classList.add(`theme-${themeName}`);

      document.querySelectorAll('.theme-chip').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.theme === themeName);
      });
      saveSettings();
    }

    // -------------------------------------------------------------
    // Toast Utility
    // -------------------------------------------------------------
    let toastTimeout = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // -------------------------------------------------------------
    // Touch & Swipe Engine for Mobile
    // -------------------------------------------------------------
    function setupTouchGestures() {
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartTime = 0;

      prompterViewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartTime = Date.now();
          resetHudTimeout();
        }
      }, { passive: true });

      prompterViewport.addEventListener('touchend', (e) => {
        const deltaX = e.changedTouches[0].clientX - touchStartX;
        const deltaY = e.changedTouches[0].clientY - touchStartY;
        const duration = Date.now() - touchStartTime;

        // Simple tap: Toggle Play/Pause
        if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10 && duration < 300) {
          togglePlayPause();
          return;
        }

        // Horizontal swipe: Adjust speed
        if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 40) {
          if (deltaX > 0) {
            adjustSpeed(5);
          } else {
            adjustSpeed(-5);
          }
        }
      });
    }

    function adjustSpeed(amount) {
      state.speed = Math.max(1, Math.min(100, state.speed + amount));
      speedSlider.value = state.speed;
      speedValueLabel.textContent = state.speed;
      saveSettings();
      showToast(`Speed: ${state.speed}`);
    }

    // -------------------------------------------------------------
    // Event Wiring
    // -------------------------------------------------------------
    function setupEventListeners() {
      // Editor & Navigation Controls
      document.getElementById('btnStartPrompter').addEventListener('click', startPrompter);
      document.getElementById('btnExitPrompter').addEventListener('click', exitPrompter);
      document.getElementById('btnNewScript').addEventListener('click', () => createNewScript());
      document.getElementById('btnDeleteCurrent').addEventListener('click', deleteCurrentScript);

      // Auto-save on typing in editor
      scriptTitleInput.addEventListener('input', () => {
        saveCurrentScriptFromEditor();
        renderScriptList();
      });
      scriptContentInput.addEventListener('input', () => {
        saveCurrentScriptFromEditor();
        updateStats();
        renderScriptList();
      });

      // Mobile Sidebar Drawer Toggle
      document.getElementById('btnToggleSidebar').addEventListener('click', () => {
        sidebar.classList.toggle('open');
      });

      // File Import Handlers
      const triggerBtn = document.getElementById('btnTriggerImport');
      triggerBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFileImport(e.target.files[0]);
      });

      // Drag and Drop Zone
      ['dragenter', 'dragover'].forEach(name => {
        editorDropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropOverlay.classList.add('drag-over');
        });
      });

      ['dragleave', 'drop'].forEach(name => {
        editorDropZone.addEventListener(name, (e) => {
          e.preventDefault();
          dropOverlay.classList.remove('drag-over');
        });
      });

      editorDropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFileImport(e.dataTransfer.files[0]);
        }
      });

      // Prompter HUD Controls
      document.getElementById('btnPlayPause').addEventListener('click', togglePlayPause);
      statusBadge.addEventListener('click', toggleWakeLock);
      
      document.getElementById('btnResetScroll').addEventListener('click', () => {
        prompterViewport.scrollTop = 0;
        updateProgress();
        showToast('Reset to start');
      });

      document.getElementById('btnMirrorX').addEventListener('click', () => {
        state.mirrorX = !state.mirrorX;
        updateMirrorTransform();
        showToast(`Horizontal Mirror: ${state.mirrorX ? 'ON' : 'OFF'}`);
      });

      document.getElementById('btnMirrorY').addEventListener('click', () => {
        state.mirrorY = !state.mirrorY;
        updateMirrorTransform();
        showToast(`Vertical Mirror: ${state.mirrorY ? 'ON' : 'OFF'}`);
      });

      document.getElementById('btnReverseDirection').addEventListener('click', () => {
        state.reverseScroll = !state.reverseScroll;
        document.getElementById('btnReverseDirection').classList.toggle('active', state.reverseScroll);
        showToast(`Scroll Direction: ${state.reverseScroll ? 'UP' : 'DOWN'}`);
      });

      speedSlider.addEventListener('input', (e) => {
        state.speed = parseInt(e.target.value, 10);
        speedValueLabel.textContent = state.speed;
        saveSettings();
      });

      fontSizeSlider.addEventListener('input', (e) => {
        state.fontSize = parseInt(e.target.value, 10);
        prompterText.style.fontSize = `${state.fontSize}px`;
        saveSettings();
      });

      widthSlider.addEventListener('input', (e) => {
        state.readingWidth = parseInt(e.target.value, 10);
        prompterWrapper.style.maxWidth = `${state.readingWidth}px`;
        saveSettings();
      });

      document.getElementById('btnToggleSettings').addEventListener('click', () => {
        settingsDrawer.classList.toggle('hidden');
      });

      document.getElementById('btnToggleGuide').addEventListener('click', () => {
        state.showEyelineGuide = !state.showEyelineGuide;
        eyelineGuide.classList.toggle('hide', !state.showEyelineGuide);
        document.getElementById('btnToggleGuide').classList.toggle('active', state.showEyelineGuide);
        saveSettings();
      });

      document.querySelectorAll('.theme-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          applyTheme(chip.dataset.theme);
        });
      });

      // Fullscreen
      document.getElementById('btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // Interactive Scrubber
      progressTrack.addEventListener('click', scrubToPosition);

      // Prompter Mouse Movement: Reveal HUD on motion
      prompterView.addEventListener('mousemove', resetHudTimeout);

      // Manual wheel scroll updates progress bar
      prompterViewport.addEventListener('scroll', updateProgress, { passive: true });

      // Keyboard Hotkeys
      window.addEventListener('keydown', handleKeyNavigation);
    }

    function handleKeyNavigation(e) {
      // Don't intercept typing in inputs
      if (document.activeElement === scriptTitleInput || document.activeElement === scriptContentInput) {
        return;
      }

      if (prompterView.classList.contains('active')) {
        switch (e.code) {
          case 'Space':
            e.preventDefault();
            togglePlayPause();
            break;
          case 'ArrowUp':
            e.preventDefault();
            adjustSpeed(2);
            break;
          case 'ArrowDown':
            e.preventDefault();
            adjustSpeed(-2);
            break;
          case 'ArrowRight':
            e.preventDefault();
            prompterViewport.scrollTop += 120;
            updateProgress();
            break;
          case 'ArrowLeft':
            e.preventDefault();
            prompterViewport.scrollTop -= 120;
            updateProgress();
            break;
          case 'KeyR':
            e.preventDefault();
            prompterViewport.scrollTop = 0;
            updateProgress();
            showToast('Reset to top');
            break;
          case 'KeyM':
            e.preventDefault();
            state.mirrorX = !state.mirrorX;
            updateMirrorTransform();
            break;
          case 'KeyF':
            e.preventDefault();
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen().catch(() => {});
            }
            break;
          case 'Escape':
            e.preventDefault();
            exitPrompter();
            break;
        }
      } else {
        // In Editor View
        if ((e.metaKey || e.ctrlKey) && e.code === 'Enter') {
          e.preventDefault();
          startPrompter();
        }
      }
    }

    // Start on DOM ready
    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
